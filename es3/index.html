<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noise Waves</title>
<style>
	body {
		background-color: rgb(255, 255, 255);
		margin: 0;
	}
	canvas {
		display: block;
	}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
<script>

function setup() {
	createCanvas(2000 , 950);
}

function draw() {
	background(255);

	noFill();
	stroke(0);

	let sn = mouseX * 0.01; // influisce sul noise
	let depth = mouseY;     // profondità del movimento

	for (let j = 50; j < height - 50; j += 6) {
		beginShape();
		for (let i = 0; i < width; i += 5) {
			let n = noise(i * 0.003 + sn, j * 0.007 + frameCount * 0.01) * 300 - depth;
			n = min(0, n); // limita valori massimi
			vertex(i, n + j);
		}
		endShape();
	}
}

</script>
</body>
</html>
